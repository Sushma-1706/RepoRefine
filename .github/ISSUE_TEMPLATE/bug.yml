name: Bug report
description: Report a reproducible problem in RepoRefine.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the repository input and the expected result. Never include tokens or private source code.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots or logs
      description: Redact credentials and personal data.
